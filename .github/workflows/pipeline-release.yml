# This workflow will install Python dependencies, run tests with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Pipeline Release (ALL)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  mongo-pytest:
    runs-on: ubuntu-latest

    services:
      # Start MongoDB 🌱
      mongo:
        # Keep in sync with production MongoDB version
        image: mongo:7.0.43
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ vars.MONGO_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASS }}
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    - name: Read Python version from Dockerfile 🔎
      id: pyver
      run: |
        echo "version=$(sed -nE 's/^FROM python:([0-9.]+)-.*/\1/p' api/Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

    - name: Set up Python ${{ steps.pyver.outputs.version }} 🐍
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.pyver.outputs.version }}

    - name: Install requirements ⏬
      run: |
        echo "--- Installing PIP"
        python -m pip install --upgrade pip
        echo "--- Installing requirements"
        if [ -f mongo/requirements.txt ]; \
          then pip install -r mongo/requirements.txt; \
        fi

    - name: Lint with flake8 📝
      run: |
        # stop the build if there are Python syntax errors or undefined names
        echo "--- Linting with flake8"
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test with PyTest ⚙️
      env:
          LOGURU_LEVEL: ${{ vars.LOGURU_LEVEL }}

          MONGO_HOST: ${{ vars.MONGO_HOST }}
          MONGO_USER: ${{ vars.MONGO_USER }}
          MONGO_PASS: ${{ secrets.MONGO_PASS }}
      run: |
        echo "--- Starting PyTest"
        pytest mongo


  app-pytest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-app: [ "ai", "ws", "api", "auth" ]

    needs:
    - mongo-pytest

    if: ${{ needs.mongo-pytest.result == 'success' }}

    environment:
      name: api

    services:
      # Start Redis 🛢️
      redis:
        # Keep in sync with production Redis version
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Start MongoDB 🌱
      mongo:
        # Keep in sync with production MongoDB version
        image: mongo:7.0.43
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ vars.MONGO_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASS }}
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    - name: Read Python version from Dockerfile 🔎
      id: pyver
      run: |
        echo "version=$(sed -nE 's/^FROM python:([0-9.]+)-.*/\1/p' ${{ matrix.python-app }}/Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

    - name: Set up Python ${{ steps.pyver.outputs.version }} 🐍
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.pyver.outputs.version }}

    - name: Install requirements ⏬
      run: |
        echo "--- Installing PIP"
        python -m pip install --upgrade pip
        echo "--- Installing PyTest prerequisites"
        pip install pytest flake8
        echo "--- Installing requirements"
        if [ -f ${{ matrix.python-app }}/requirements.txt ]; \
          then pip install -r ${{ matrix.python-app }}/requirements.txt; \
        fi
        echo "--- Installing test-only requirements"
        if [ -f ${{ matrix.python-app }}/requirements-tests.txt ]; \
          then pip install -r ${{ matrix.python-app }}/requirements-tests.txt; \
        fi

    - name: Lint with flake8 📝
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test with PyTest ⚙️
      env:
          LOGURU_LEVEL: ${{ vars.LOGURU_LEVEL }}
          GUNICORN_CHDIR: ${{ vars.GUNICORN_CHDIR }}

          SEP_SECRET_KEY: ${{ secrets.SEP_SECRET_KEY }}
          API_ENV: ${{ vars.API_ENV }}

          MONGO_HOST: ${{ vars.MONGO_HOST }}
          MONGO_USER: ${{ vars.MONGO_USER }}
          MONGO_PASS: ${{ secrets.MONGO_PASS }}

          SEP_SMTP_FROM: ${{ secrets.SEP_SMTP_FROM }}
          SEP_SMTP_SERVER: ${{ secrets.SEP_SMTP_SERVER }}
          SEP_SMTP_USER: ${{ secrets.SEP_SMTP_USER }}
          SEP_SMTP_PASS: ${{ secrets.SEP_SMTP_PASS }}
          SEP_SMTP_HOSTNAME: ${{ secrets.SEP_SMTP_HOSTNAME }}
      run: |
        echo "--- Moving mongo lib where it belongs"
        cp -a mongo ${{ matrix.python-app }}/
        echo "--- Starting app in background"
        # Used for ai, api, ws, auth
        if [ -f ${{ matrix.python-app }}/main.py ]
          then python3 ${{ matrix.python-app }}/main.py &
        fi
        # /auth/* moved out of api into its own service - api's own suite
        # still needs a live login (see api/tests/conftest.py's jwt_header
        # fixture, which registers/logs in against AUTH_API_URL), so start
        # auth here too, in its own venv (its requirements.txt is compiled
        # independently from api's and can drift on shared transitive
        # deps - same as they would in their own separate containers).
        if [ "${{ matrix.python-app }}" = "api" ]; then
          echo "--- Also starting auth (api's tests need a live login) ---"
          cp -a mongo auth/
          python3 -m venv /tmp/venv-auth
          /tmp/venv-auth/bin/pip install -q -r auth/requirements.txt
          GUNICORN_PORT=5001 /tmp/venv-auth/bin/python3 auth/main.py &
          export AUTH_API_URL=http://127.0.0.1:5001
        fi
        echo "--- Sleep(${{ vars.STARTUP_SLEEP }}) (`date`)"
        sleep ${{ vars.STARTUP_SLEEP }}
        echo "--- Starting PyTest (`date`)"
        pytest ${{ matrix.python-app }}/tests/

  build-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-app: [ "ai", "ws", "api", "discord", "auth" ]

    needs:
    - app-pytest

    # We need to have a successful app-pytest before
    if: ${{ needs.app-pytest.result == 'success' }}

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v7

    - name: Log in to Docker Hub 🔐
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extracting Metadata 🔧
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKER_USERNAME }}/${{ matrix.python-app }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=,suffix=,format=short
          type=edge
          type=raw,value=latest

    - name: Build & Push to Docker Hub 🚀
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./${{ matrix.python-app }}/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          APP_VERSION=${{ steps.meta.outputs.version }}
          GIT_COMMIT=${{ github.sha }}
